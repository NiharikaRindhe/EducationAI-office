worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  gzip          on;
  gzip_types    text/plain application/json application/javascript text/css;

  # ── Rate limiting zones ─────────────────────────────────────
  # These are keyed on client IP, which means one KEY PER SCHOOL, not per
  # student, whenever the school reaches the server through a NAT gateway
  # (i.e. any hosted deployment — only a LAN install sees per-PC addresses).
  # A whole lab shares one budget, so these are sized for "a class of ~40 all
  # clicking at once", not for one person. They are a blunt anti-abuse floor;
  # the meaningful per-student limit is enforced in the app, keyed on user id
  # (see chatLimiter in api/src/routes/student.routes.ts), which NAT can't
  # collapse.
  limit_req_zone $binary_remote_addr zone=api:10m rate=200r/s;

  # AI/LLM endpoints — expensive per call, so kept tighter than general API
  # traffic, but still sized for a full class starting a chat in the same
  # minute rather than for a single user.
  limit_req_zone $binary_remote_addr zone=ai:10m rate=30r/s;

  # 429 tells a client "slow down / retry"; nginx's default 503 reads as
  # "the server is broken" and is what a browser will surface to a student.
  limit_req_status 429;

  # ── Upstream services ───────────────────────────────────────
  # The API is stateless (background jobs live in the `worker` service), so it
  # scales horizontally: add replicas as `server api2:3001;` etc. here — or
  # point this at a real load balancer. Note that with a static `server` entry
  # nginx resolves the name once at startup, so `docker compose up --scale`
  # alone will NOT spread load; the replicas have to be listed.
  upstream api_backend {
    server api:3001;
    # One upstream connection per concurrent request, reused. Raised from 16
    # because embeddings + LLM calls hold connections open for seconds, so a
    # class chatting at once keeps far more of them in flight than a
    # page-load-shaped workload would.
    keepalive 64;
  }

  upstream supabase_backend {
    server kong:8000;
    keepalive 8;
  }

  # ── HTTP → HTTPS redirect (production) ─────────────────────
  server {
    listen 80;
    server_name _;

    # Allow Let's Encrypt ACME challenges through
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ── HTTPS main server ───────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Static frontend (React / Vite build) ──────────────────
    location / {
      root   /usr/share/nginx/html;
      index  index.html;
      try_files $uri $uri/ /index.html;  # SPA fallback
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
    }

    # Cache static assets aggressively (content-hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
      root    /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # ── EduAI Node API ─────────────────────────────────────────
    location /api/ {
      limit_req zone=api burst=120 nodelay;
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      client_max_body_size 150m;    # Match NCERT PDF upload limit (api/routes/superAdmin.routes.ts)
      # Longer than the app's own 120s LLM timeout (AbortSignal in lib/ai.ts).
      # When these were both 120s nginx raced the app and usually won, so a
      # slow model surfaced as a bare 504 instead of the app's handled error
      # (which falls back to local Ollama and returns a real message).
      proxy_read_timeout   180s;
    }

    # Tighter rate limit for the AI tutor.
    #
    # This previously matched ^/api/(teacher|student)/ai — a path that does not
    # exist in the API, so the AI limit never applied to anything and all chat
    # traffic silently fell through to the general /api/ zone instead.
    #
    # Scoped to chat ONLY, deliberately. Exam submission and English
    # assessment also call the LLM (auto-grading), but they are one-shot
    # actions a student cannot simply retry — and a whole class submits within
    # the same minute at the end of a period, which is exactly the shape that
    # trips a rate limit. Throttling those would mean losing a student's exam
    # to a 429. They stay on the general zone; chat is interactive and safely
    # retryable, so it is the one that gets throttled.
    location ~ ^/api/student/chat/ {
      limit_req zone=ai burst=60 nodelay;
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_read_timeout 180s;
    }

    # ── Supabase REST / Auth / Realtime / Storage ──────────────
    location /supabase/ {
      rewrite ^/supabase/(.*) /$1 break;
      proxy_pass         http://supabase_backend;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        "upgrade";
      client_max_body_size 150m;
    }
  }
}
